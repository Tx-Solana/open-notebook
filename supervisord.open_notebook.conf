[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=uv run uvicorn api.main:app --host 0.0.0.0 --port 5055
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10
autostart=true

# Worker - starts on demand via WorkerManager
[program:worker]
command=uv run surreal-commands-worker --import-modules commands
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false  # Don't auto-restart - managed by WorkerManager
priority=20
autostart=false    # Start on demand
startsecs=3

# Optional: Worker Monitor (can be started manually or via WorkerManager)
[program:worker-monitor]
command=/app/scripts/smart-worker-monitor.sh 300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false  # Monitor exits when worker stops
priority=25
autostart=false    # Start on demand
startsecs=1

[program:streamlit]
command=uv run streamlit run app_home.py --server.port=8502 --server.address=0.0.0.0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=30
autostart=true
startsecs=5
